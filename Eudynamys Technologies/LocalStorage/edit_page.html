<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
    *{
        margin: 0;
        padding:0;
        box-sizing:border-box;
        font-family:'Inter',sans-serif;
    }
    body{
        width:100%;
        height:100vh;
        background-color:#fff;  
    }
    .heading{
        text-align:center;
        padding: 10px 20px;
        color:blueviolet;
    }
    .container{
        width: 500px;
        margin:auto;
        border:1px solid #ccc;
        border-radius:10px;
        overflow:hidden;
        box-shadow:0 0 10px rgba(0,0,0,0.1);
        margin-bottom: 80px;
    }
    .navbar{
        display:flex;
        justify-content:space-between;
        align-items: center;
        padding:15px 30px;
        font-size:18px;
        color:black;
        background-color:#fff;
        margin-bottom: 5px;
    }
    .navbar a{
        text-decoration: none;
        font-size: 20px;
        color: black;
    }
    .navbar a.edit{
        text-decoration: none;
        font-size: 20px;
        color:blueviolet;
    }

    .nav_right button{
        padding:8px 15px;
        border-radius:5px;
        border:none;
        background-color:blueviolet;
        color:#fff;
        font-size: 18px;
        font-weight:600;
        cursor: pointer;

    }
    .main_section{
        justify-content: center;
        margin-top: 5px;
    }
    
    .right_content{
        margin-top: 5px;
        padding: 50px;
    }
    .left{
        display: flex;
        justify-content:center;
        gap: 10px;
    }
    .details{
        width: 100;
        border: 1px solid #ccc;
        border-radius: 5px;
        padding: 20px 20px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .row{
        padding: 20px 0;
        border-bottom: 1px solid #eee;
    }
    .row:last-child{
        border-bottom: none;
    }
    .label{
        display: block;
        font-weight: bold;
        margin-bottom: 10px;
        color: #333;
    }
    .value{
        color: #555;
    }
    .input_box{
        width:100%;
        padding: 12px 25px;
        margin-bottom: 15px;
        border-radius: 5px;
        outline: none;
        border: 1px solid #ccc;
        font-size: 16px;
    }
    .note{
        color: #777;
        font-size: 13px;
        margin-bottom: 10px;
    }

    .input:readonly{
        background-color: #7a7878;
    }
    .savebtn{
        width: 100%;
        padding: 12px 25px;
        margin-bottom: 5px;
        font-size: 18px;
        color: #fff;
        border-radius: 5px;
        outline: none;
        background-color: blueviolet;
        margin-top: 25px;
    }
    .cancelbtn{
        width: 100%;
        padding: 12px 25px;
        margin-bottom: 13px;
        font-size: 18px;
        color: blueviolet;
        border-radius: 5px;
        outline: none;
        background-color: #fff;
        margin-top: 15px;
        border: 2px solid blueviolet;
    }
    span{
        color: red;
        font-size: 13px;
        display: block;
        margin-bottom: 10px;
    }
   
    </style>    
</head>
<body>
    <div class="heading">
        <h2>EDIT PROFILE SCREEN</h2>
    </div>
    <div class="container">
        <div class="navbar">
            <div class="left">
                <a href="profile_page.html"><i class="fa-solid fa-arrow-left"></i></a></button>
                <h3>Edit Profile</h3>
            </div>  
        </div> 
        <div class="main_section">
            <div class="right_content">
                <div class="label">First Name</div>
                <input type="text" id="fname" class="input_box" onkeyup="validatefname()">
                <span id="namefError"></span> 
                <div class="label">Last Name</div>
                <input type="text" id="lname" class="input_box" onkeyup="validatelname()">
                <span id="namelError"></span> 
                <div class="label">Email</div>
                <div>
                <input type="email" id="email" class="input_box" readonly>
                </div>
                <p class="note">Email cannot be changed</p>
                <div class="label">Mobile Number</div>
                <input type="text" id="number" class="input_box" onkeyup="validatemobile()" >
                <span id="mobileError"></span> 
                <button type="button" onclick="save()" class="savebtn">Save Changes</button> 
                <button type="button" onclick="cancel()" class="cancelbtn">Cancel</button>
                </div> 
        </div>
    </div>
<script src="edit.js"></script>    
</body>
</html>
