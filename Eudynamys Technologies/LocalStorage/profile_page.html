<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
    *{
        margin: 0;
        padding:0;
        box-sizing:border-box;
        font-family:'Inter',sans-serif;
    }
    body{
        width:100%;
        height:100vh;
        background-color:#fff;  
    }
    .heading{
        text-align:center;
        padding: 10px 20px;
        color:blueviolet;
    }
    .container{
        width: 600px;
        margin:auto;
        border:1px solid #ccc;
        border-radius:10px;
        overflow:hidden;
        box-shadow:0 0 10px rgba(0,0,0,0.1);
        margin-bottom: 100px;
    }
    .navbar{
        display:flex;
        justify-content:space-between;
        align-items: center;
        padding:15px 30px;
        font-size:18px;
        color:black;
        background-color:#fff;
    }
    .navbar a{
        text-decoration: none;
        font-size: 20px;
        color: black;
    }
    .navbar a.edit{
        text-decoration: none;
        font-size: 20px;
        color:blueviolet;
    }

    .nav_right button{
        padding:8px 15px;
        border-radius:5px;
        border:none;
        background-color:blueviolet;
        color:#fff;
        font-size: 18px;
        font-weight:600;
        cursor: pointer;

    }
    .main_section{
        justify-content: center;
    }
    
    .right_content{
        padding: 50px;
    }
    .left{
        display: flex;
        justify-content:center;
        gap: 10px;
    }
    .details{
        width: 100;
        border: 1px solid #ccc;
        border-radius: 5px;
        padding: 20px 20px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .row{
        padding: 20px 0;
        border-bottom: 1px solid #eee;
    }
    .row:last-child{
        border-bottom: none;
    }
    .label{
        font-weight: bold;
        margin-bottom: 10px;
        color: #333;
    }
    .value{
        color: #555;
    }


    .editbtn{
        width: 100%;
        padding: 12px 25px;
        margin-bottom: 5px;
        font-size: 18px;
        color: #fff;
        border-radius: 5px;
        outline: none;
        background-color: blueviolet;
        margin-top: 30px;
    }
    .changebtn{
        width: 100%;
        padding: 12px 25px;
        margin-bottom: 13px;
        font-size: 18px;
        color: #fff;
        border-radius: 5px;
        outline: none;
        background-color: blueviolet;
        margin-top: 15px;
    }
    .profile{
        text-align: center;
        margin-top: 30px;
    }
    .profile-img {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 15px;
    }  
    </style>    
</head>
<body>
    <div class="heading">
        <h2>PROFILE SCREEN</h2>
    </div>
    <div class="container">
        <div class="navbar">
            <div class="left">
                <a href="dashboard.html"><i class="fa-solid fa-arrow-left"></i></a></button>
                <h3>Profile</h3>
            </div>
              <a class="edit" href="edit_page.html"><i class="fa-solid fa-pen"></i>
            </a>  
        </div> 
        <div class="main_section">
            <div class="profile">
                <img src="profile.png" alt="Profile" class="profile-img">
            </div>    

            <div class="right_content">
                <div class="details">
                    <div class="row">
                        <div class="label">First Name</div>
                        <div class="values" id="fname">
                    </div>
                    </div>

                    <div class="row">
                        <div class="label">Last Name</div>
                        <div class="values" id="lname">
                    </div>
                    </div>
                    
                    <div class="row">
                        <div class="label">Email</div>
                        <div class="values" id="email">
                    </div>
                    </div>
                    
                    <div class="row">
                        <div class="label">Mobile Number</div>
                        <div class="values" id="mobile"></div>
                    </div>
                </div>
                
                <button type="button" onclick="edit()" class="editbtn">Edit Profile</button> 
                <button type="button" onclick="change_pass()" class="changebtn">Change Password</button> 
            </div>
        </div>
    </div>
<script src="profile.js"></script>    
</body>
</html>
