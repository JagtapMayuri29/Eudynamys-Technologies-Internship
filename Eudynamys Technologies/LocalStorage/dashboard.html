<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            width: 100%;
            height: 100vh;
            background-color: #fff;
        }

        .heading {
            text-align: center;
            padding: 10px 20px;
            color: blueviolet;
        }

        .container {
            width: 900px;
            margin: auto;
            border: 1px solid #ccc;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: right;
            padding: 15px;
            font-size: 18px;
            color: #fff;
            background-color: #11112d;
        }

        .nav_right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .nav_right button {
            padding: 8px 15px;
            border-radius: 5px;
            border: none;
            background-color: blueviolet;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;

        }

        .main_section {
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
        }

        .left_content {
            width: 20%;
        }

        .right_content {
            width: 80%;
            padding: 0px 20px;
        }

        .right_content h1 {
            margin-bottom: 15px;
        }

        .right_content p {
            color: darkgray;
            margin-bottom: 30px;
        }

        .sidebar {

            background-color: #9996b3;
            padding: 25px 15px;
        }

        .menu {
            list-style: none;
        }

        .menu li {
            margin-bottom: 10px;
        }

        .menu a {
            display: block;
            padding: 14px 15px;
            text-decoration: none;
            color: #333;
            border-radius: 8px;
        }

        .menu a:hover {
            background-color: #e5dcff;
            color: blueviolet;
        }

        .menu .active {
            background-color: #e5dcff;
            color: blueviolet;
            font-weight: bold;
        }

        .profile {
            text-align: center;
            margin-top: 30px;
        }

        .profile-img {
            width: 120px;
            height: 120px;

            border-radius: 50%;
            object-fit: cover;

            margin-bottom: 15px;
        }

        .profile h2 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .profile p {
            color: gray;
        }

        .user-details {
            width: 80%;
            max-width: 700px;
            margin: 25px auto;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            overflow: hidden;
        }

        .detail-row {
            display: flex;

            padding: 18px 30px;

            border-bottom: 1px solid #eee;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            width: 50%;
            font-weight: bold;
        }

        .detail-value {
            width: 50%;
            color: #555;
        }


        /* ================= MOBILE ================= */

        @media (max-width: 768px) {

            .sidebar {
                width: 160px;
            }

            .content {
                padding: 20px;
            }

            .user-details {
                width: 100%;
            }

            .detail-row {
                padding: 15px;
            }

        }
    </style>
</head>

<body>
    <div class="heading">
        <h2>DASHBOARD SCREEN</h2>
    </div>
    <div class="container">
        <div class="navbar">
            <h3>AuthApp</h3>
            <div class="nav_right">Welcome<button onclick="logout()">Logout</button></div>
        </div>
        <div class="main_section">
            <div class="left_content">
                <ul class="menu">
                    <li>
                        <a href="#" class="active"> Dashboard
                        </a>
                    </li>
                    <li>
                        <a href="profile_page.html">Profile</a>
                    </li>
                    <li>
                        <a href="#">Settings</a>
                    </li>
                    <li>
                        <a href="#">Help</a>
                    </li>
                </ul>
            </div>

            <div class="right_content">
                <div class="h1">
                    <h1>Dashboard</h1>
                </div>
                <div>
                    <p>Here is your Account Information</p>
                </div>
                <div class="profile">

                    <img src="profile.png" alt="Profile" class="profile-img">

                    <h2>
                        Welcome,
                        <span id="username"></span>
                    </h2>

                    <p>
                        Glad to see you back!
                    </p>

                </div>



                <!-- User Details -->

                <div class="user-details">


                    <!-- Name -->

                    <div class="detail-row">

                        <div class="detail-label">
                            👤 &nbsp; First Name
                        </div>

                        <div class="detail-value" id="fname">

                        </div>

                    </div>

                     <div class="detail-row">

                        <div class="detail-label">
                            👤 &nbsp; Last Name
                        </div>

                        <div class="detail-value" id="lname">

                        </div>

                    </div>



                    <!-- Email -->

                    <div class="detail-row">

                        <div class="detail-label">
                            ✉️ &nbsp; Email Address
                        </div>

                        <div class="detail-value" id="email">

                        </div>

                    </div>


                    <!-- Mobile -->

                    <div class="detail-row">

                        <div class="detail-label">
                            📞 &nbsp; Mobile Number
                        </div>

                        <div class="detail-value" id="mobile">

                        </div>

                    </div>
                    <div class="detail-row">

                        <div class="detail-label">
                            📅 &nbsp; Member Since
                        </div>

                        <div class="detail-value" id="memberSince">

                        </div>

                    </div>

                </div>
            </div>
        </div>
        <script src="dashboard.js"></script>
</body>

</html>
