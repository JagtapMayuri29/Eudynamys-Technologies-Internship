<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
    *{
        margin: 0;
        padding:0;
        box-sizing:border-box;
        font-family:'Inter',sans-serif;
    }
    body{
        width:100%;
        height:100vh;
        background-color:#fff;  
    }
    .heading{
        text-align:center;
        padding: 10px 20px;
        color:blueviolet;
    }
    .container{
        width: 900px;
        margin:auto;
        border:1px solid #ccc;
        border-radius:10px;
        overflow:hidden;
        box-shadow:0 0 10px rgba(0,0,0,0.1);
        margin-bottom: 30px;
    }
    .navbar{
        display:flex;
        justify-content:space-between;
        align-items:center;
        text-align:right;
        padding:15px;
        font-size:18px;
        color:#fff;
        background-color:#11112d;
    }
    .nav_right{
        display:flex;
        align-items:center;
        gap: 15px;
    }
    .nav_right button{
        padding:8px 15px;
        border-radius:5px;
        border:none;
        background-color:blueviolet;
        color:#fff;
        font-size: 18px;
        font-weight:600;
        cursor: pointer;

    }
    .main_section{
        display: flex;
        justify-content: center;
        align-items:flex-start;
    }
    .left_content{
        width: 40%;
    }
    .right_content{
        width: 60%;
        padding: 50px;
    }
    .left_content img{
        width:100%;
        height:100vh;
        
    }
    .right_content h1{
        margin-bottom: 15px;
    }
    .right_content p{
        color:darkgray;
        margin-bottom: 30px;
    }
    input[type="text"],[type="password"]{
        width: 100%;
        padding: 12px 25px;
        margin-bottom: 15px;
        font-size: 18px;
        border-radius: 5px;
        border: 1px solid #ccc;
        outline:none;
        transition: border-color 0.3s ease;
    }
    .input_box{
        width: 100%;
        margin-bottom: 18px;
        position: relative;
    }
    .input_box span{
        position: absolute;
        right: 15px;
        top: 12px;
        cursor: pointer;
        color: #110707;
    }
    input:focus{
    border-color:blueviolet;
    }
    .btnlog{
        width: 100%;
        padding: 12px 25px;
        margin-bottom: 13px;
        font-size: 18px;
        color: #fff;
        border-radius: 5px;
        outline: none;
        background-color: blueviolet;
        margin-top: 30px;
    }
    .para{
        color:darkgray;
        margin-bottom: 30px;
        text-align: center;
        margin-top: 15px;
    }
    .para a{
        text-decoration: none;
        color: blueviolet;
        font-weight:bold;
        margin-left: 10px;
    }
    .option{
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 20px;
    }
    label{
        font-size: 18px;
        color: gray;
    }
    .option a{
        text-decoration: none;
        color: blueviolet;
    }
    span{
        color: red;
        font-size: 13px;
        display: block;
        margin-bottom: 10px;
    }
    </style>    
</head>
<body>
    <div class="heading">
        <h2>LOGIN SCREEN</h2>
    </div>
    <div class="container">
        <div class="navbar">
            <h3>AuthApp</h3>
            <div class="nav_right">Don't have an account?<a href="signup.html"><button>Sign Up</button></a></div>
        </div>
        <div class="main_section">
            <div class="left_content">
                <img src="IMG-20260807-WA00012.jpg" alt="loginup">
            </div>
            <div class="right_content">
                <div class="h1">
                    <h1>Welcome Back!</h1>
                </div>
                <div>
                    <p>Login to your Account</p> 
                </div>
                <input type="text" id="Lemail" onkeyup="validateemail()"  placeholder="Email Address">
                <span id="emailError"></span>
                <div class="input_box">
                <input type="password" id="Lpassword" onkeyup="validatepass()"  placeholder="Password">
                    <span onclick="showPassword()">👁</span>
                    </div>
                <span id="passwordError"></span>
                <div class="option">   
                <label>
                    <input type="checkbox" id="check">Remember me</label>
                    <a href="#">Forget Password?</a>
                </div>
                <button type="button" onclick="login()" class="btnlog">Login</button>
                <div class="para">
                    Do you have an account?<a href="signup.html">Sign up</a> 
                </div>   
            </div>
        </div>
    </div>
<script src="login.js"></script>    
</body>
</html>
