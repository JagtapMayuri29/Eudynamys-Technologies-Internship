<!DOCTYPE html>
<html lang="en">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<head>
<title>Color Change</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body{
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}
      
.container{
    width:800px;
    height:500px;
}


.changecolor{
    width: 100%;
    height: 100%;
    background-color:#ffffff;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:15px;
    transition:background-color 0.4s ease;
    border: 1px solid;
    border-radius: 0.5rem;
}

.clickbtn{
    padding: 15px 25px;
    border-radius: 0.5rem;
    font-size: 16px; 
    cursor: pointer;
}
.hexcode{
    font-size:25px;
    font-weight:bold;
}
</style>
</head>
<body>
    <div class="container">
    <div class="changecolor">
        <div class="hexcode">#FFFFFF</div>
    <input type="button" class="clickbtn" id="btn" onclick="changeColor()" value="Change Color">
    </div>
    </div>
    <script>
    const colors = ["#FF5733","#33FF57","#3357FF","#F1C40F","#9B59B6","#1ABC9C","#E74C3C"];
    function changeColor()
    {
        const randomIndex = Math.floor(Math.random() * colors.length);
        document.querySelector(".changecolor").style.backgroundColor = colors[randomIndex];
        document.querySelector(".hexcode").textContent= colors[randomIndex]
    }
    </script>
</body>
</html>
