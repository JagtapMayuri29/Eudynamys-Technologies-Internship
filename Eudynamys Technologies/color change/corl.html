<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Color Generator</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, Helvetica, sans-serif;
    background:#f5f5f5;
}

.container{
    width:800px;
    height:500px;
}

.changecolor{
    width:100%;
    height:100%;
    border:2px solid #000;
    border-radius:12px;
    background:#FFFFFF;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:15px;

    transition:background-color 0.4s ease;
}

.hexcode{
    font-size:32px;
    font-weight:bold;
}

.clickbtn{
    padding:15px 25px;
    font-size:18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#222;
    color:#fff;
}

.clickbtn:hover{
    background:#444;
}
</style>

</head>
<body>

<div class="container">
    <div class="changecolor">

        <div class="hexcode">#FFFFFF</div>

        <button class="clickbtn" onclick="changeColor()">
            Change Color
        </button>

    </div>
</div>

<script>
function changeColor(){

    const hex = "0123456789ABCDEF";
    let color = "#";

    for(let i = 0; i < 6; i++){
        color += hex[Math.floor(Math.random() * 16)];
    }

    document.querySelector(".changecolor").style.backgroundColor = color;
    document.querySelector(".hexcode").textContent = color;
}
</script>

</body>
</html>
