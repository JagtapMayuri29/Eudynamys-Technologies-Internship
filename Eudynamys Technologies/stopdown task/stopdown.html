<!DOCTYPE html>
<html lang="en">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<head>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body{
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: black;
    color: white;
}
.container{
   text-align: center;
    
}
.count{

    display:flex;
    justify-content:center;
    align-items:center;
    color: white;
    font-size: 50px;
    font-weight: bold;
    border-radius: 5rem;
    border: 6px solid;
    width: 140px;
    height: 140px;
}
button{
    margin-top:50px;
    padding:12px 25px;
    font-size:18px;
    cursor:pointer;
    border-radius:8px;
    border:none;
}
</style>    
</head>
<body>
    <div class="container">
        <h1 class="count" id="Count">10</h1>
        <h2 class="text" id="Text"></h2>
        <button onclick="start()">Start</button>
    </div>
<script>

function start(){
    let num = 10;
    document.getElementById("Count").innerHTML = num;
    document.getElementById("Text").innerHTML = "";
    let timer = setInterval(function(){
        num--;
        document.getElementById("Count").innerHTML = num;
        if(num == 0){
            clearInterval(timer);
            document.getElementById("Text").innerHTML = "Time's up";
        }
    },1000);

}

</script>    
</body>
</html>
