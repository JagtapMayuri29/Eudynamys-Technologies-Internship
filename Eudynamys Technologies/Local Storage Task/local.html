<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local Storage Example</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
<style>
*{
    margin: 0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Inter', sans-serif;
}
body{
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color:#fff;   
}
.inputs-box{
    display: flex;
    align-items: center;
    gap: 10px;
}
input[type="text"]{
    padding: 10px 20px;
    font-size: 16px;
    margin-bottom: 15px;
    border-radius: 4px;
    border: 1px solid #cccccc;
}
input[type="password"]{
    padding: 10px 20px;
    font-size: 16px;
    margin-bottom: 15px;
    border-radius: 4px;
    border: 1px solid #cccccc;
}
button{
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
    border-radius: 4px;
    border: 1px solid #cccccc;
    color: #fff;
    font-weight: bold;
    background-color:#008000;
}
.list{
    margin-top:20px;
    padding:10px;
    border: 1px double #ccc;
}
table{
    width:100%;
    border-collapse:collapse;
    border: double 4px #ddd;
}

th,td{
    border:4px double #ccc;
    padding:10px;
    text-align:center;
}
</style>
</head>

<body>
<div class="container">
    <div class="inputs-box">
        <input type="text" id="name" placeholder="Name" class="inputs" onkeyup="getName()">
        <input type="text" id="address" placeholder="Address" class="inputs" onkeyup="getAddress()">
        <input type="text" id="phone" placeholder="Phone Number" class="inputs" onkeyup="getPhone()">
        <input type="password" id="password" placeholder="Password" class="inputs" onkeyup="getPassword()">
    </div>
    <button onclick="storeData()">Store Data</button>
    <table class="list" id="list" border="4">
        <tr>
            <th>Name</th>
            <th>Address</th>
            <th>Phone Number</th>
            <th>Password</th>
            <th>Action</th>
        </tr>
    </table>
    <script src="local.js"></script>
</body>

</html>
